<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回传通道自检</title>
<style>
  body{margin:0;background:#0b0f14;color:#e6edf3;font:600 15px/1.6 ui-monospace,Consolas,monospace}
  pre{margin:0;padding:14px;white-space:pre-wrap;word-break:break-all}
  .ok{color:#6ee7a0}.bad{color:#ff9a9a}.dim{color:#8b98a5}
</style>
</head>
<body>
<pre id="out">运行中…</pre>
<script>
var out = document.getElementById('out');
var RELAY = 'https://formsubmit.co/ajax/2820575692@qq.com';
function show(html){ out.innerHTML = html; }

(async function(){
  var lines = [];
  lines.push('origin: ' + location.origin);
  lines.push('时间: ' + new Date().toLocaleString('zh-CN'));
  lines.push('');

  var payload = {
    '内容': '【线上自检】这是一条来自正式站点的回传测试，请忽略。',
    '_subject': '【楚门2.0】线上自检',
    '_captcha': 'false',
    '天气': '晴天',
    '画面': innerWidth + 'x' + innerHeight,
    '设备': /Mobile|Android|iPhone/i.test(navigator.userAgent) ? '手机' : '电脑'
  };

  var t0 = performance.now();
  try{
    var r = await fetch(RELAY, {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: new URLSearchParams(payload),
      credentials: 'omit',
      keepalive: true,
      referrer: location.href,
      referrerPolicy: 'unsafe-url'
    });
    var txt = await r.text();
    var ms = Math.round(performance.now() - t0);
    var success = false;
    try{ success = String(JSON.parse(txt).success) === 'true'; }catch(e){}

    lines.push('HTTP ' + r.status + ' / ' + ms + 'ms');
    lines.push('');
    if(success){
      lines.push('<span class="ok">✔ PASS 生产链路已通</span>');
      lines.push('<span class="dim">邮件应已发到 QQ 邮箱</span>');
    }else{
      lines.push('<span class="bad">✘ FAIL 生产链路未通</span>');
      lines.push('<span class="dim">FormSubmit 回执见下</span>');
    }
    lines.push('');
    lines.push('raw: ' + txt);
    show(lines.join('\n'));
  }catch(e){
    lines.push('<span class="bad">✘ 请求异常</span>');
    lines.push(e.name + ' | ' + e.message);
    show(lines.join('\n'));
  }
})();
</script>
</body>
</html>
