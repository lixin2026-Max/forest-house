name: Deploy to GitHub Pages

# 说明：本站的唯一发布通道（仓库 Pages 的 Source 已设为 GitHub Actions，
# 即 build_type=workflow；分支直发已关闭，不要再改回 Deploy from a branch）。
#
# 组装方式：整树同步 —— 仓库根目录原样进 _site，只排除 .git/.github/_site。
# 不再维护「要带哪些文件」的枚举清单：v5.1 当晚查实，旧清单停留在「只发页面」
# 时代，漏带 assets/app/download.html/version.json，产物生效时线上音乐/模型/
# 安装包/下载页/版本指针全 404，还与分支直发互覆、谁后完成谁生效，造成线上
# 时好时坏（见 CHANGELOG.md v5.1 维护侧）。整树同步后新增任何文件自动带上，
# 此类事故不再复发。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 整树组装站点
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          ls _site

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
