name: Deploy to GitHub Pages

# 说明：本站的唯一发布通道（仓库 Pages 的 Source 已设为 GitHub Actions，
# 即 build_type=workflow；分支直发已关闭，不要再改回 Deploy from a branch）。
#
# 组装方式：整树同步 —— 仓库根目录原样进 _site，只排除 .git/.github/_site。
# 不再维护「要带哪些文件」的枚举清单：v5.1 当晚查实，旧清单停留在「只发页面」
# 时代，漏带 assets/app/download.html/version.json，产物生效时线上音乐/模型/
# 安装包/下载页/版本指针全 404，还与分支直发互覆、谁后完成谁生效，造成线上
# 时好时坏（见 CHANGELOG.md v5.1 维护侧）。整树同步后新增任何文件自动带上，
# 此类事故不再复发。

# 测试卡点（Issue #12）：push 到 main 与 PR 都先跑 test job，全绿 deploy 才放行；
# PR 只跑测试不发布（deploy job 限定非 PR 事件）。test 跑 node test/all.js 全套，
# 浏览器套件认 PERF_CHROME（见 test job），子路径套件在无 Edge 的 Linux 上跳过
# （test/subpath-check.js 内分流），不因此拦部署。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 装 Chrome（供浏览器套件）
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: 全套回归
        run: node test/all.js
        env:
          PERF_CHROME: ${{ steps.chrome.outputs.chrome-path }}

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 整树组装站点
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          ls _site

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
