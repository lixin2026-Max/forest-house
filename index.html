<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 安全基线：除「同源」与回传邮箱服务外不允许任何外部加载 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src 'self' https://formsubmit.co; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>森林小屋 · 优化版 Three.js 场景</title>
<style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;padding:0;overflow:hidden;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#1a2a1a;
         overscroll-behavior:none;-webkit-text-size-adjust:100%}
    #scene{position:absolute;inset:0;touch-action:none}
    #scene canvas{display:block;width:100%!important;height:100%!important}
    #ui{position:absolute;top:15px;left:15px;background:rgba(10,20,10,.78);color:#fff;padding:16px;border-radius:10px;font-size:13px;z-index:100;width:340px;backdrop-filter:blur(6px)}
    #ui h3{margin:0 0 6px 0;font-size:17px;color:#ffd97a}
    #ui .hint{font-size:11px;color:#a8bba8;line-height:1.5;margin-bottom:10px}
    #ui .hint .touch{display:none}
    .wbtns{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
    .wbtns button{flex:1;min-width:56px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#dfe8df;padding:7px 4px;border-radius:6px;cursor:pointer;transition:.15s;font-size:12px}
    .wbtns button:hover{background:rgba(255,255,255,.22)}
    .wbtns button.active{background:rgba(255,190,80,.28);border-color:#ffd97a;color:#fff;font-weight:bold}
    .row{display:flex;align-items:center;justify-content:space-between;margin:7px 0;font-size:12px}
    .row label{color:#c8d8c8}
    .row input[type=range]{width:170px;accent-color:#ffd97a}
    .row b{color:#ffd97a;min-width:42px;text-align:right}
    #status{position:absolute;top:15px;right:15px;background:rgba(10,20,10,.78);color:#cfe3cf;padding:10px 14px;border-radius:8px;font-size:12px;z-index:100;line-height:1.7;min-width:180px}
    #error{display:none;position:fixed;inset:0;background:rgba(20,0,0,.94);color:#ffb4b4;z-index:999;padding:40px;font-size:15px;line-height:1.8;white-space:pre-wrap;overflow:auto}

    /* ---------- 移动端 / 窄屏适配 ---------- */
    #app{position:fixed;inset:0;overflow:hidden}
    /* 暗角 + 轻微饱和，压住画面四角、让中间主体更聚焦 */
    #app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:60;
        background:radial-gradient(115% 85% at 50% 48%, rgba(0,0,0,0) 42%, rgba(0,0,0,.30) 100%)}
    /* 竖屏时把整个画布旋转 90° 当成横屏用（纯 CSS，无需用户手势） */
    body.rot90 #app{inset:auto;top:50%;left:50%;width:100vh;height:100vw;
        transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center}
    @media (max-width:600px), (pointer:coarse){
        #ui{top:6px;left:6px;right:6px;width:auto;max-width:420px;padding:8px 10px;font-size:12px;border-radius:8px}
        #ui h3{font-size:14px;margin-bottom:3px}
        #ui .hint{font-size:10.5px;margin-bottom:6px}
        #ui .hint .mouse{display:none}
        #ui .hint .touch{display:inline}
        .wbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:6px}
        .wbtns button{padding:10px 0;font-size:11.5px;min-width:0}
        .row{display:grid;grid-template-columns:auto 1fr 40px;gap:6px;align-items:center;margin:2px 0}
        .row label{font-size:11.5px}
        .row input[type=range]{width:100%;margin:0;height:24px}
        .row b{text-align:right;font-size:11.5px;min-width:0}
        #status{top:auto;bottom:6px;left:6px;right:6px;min-width:0;padding:6px 9px;font-size:10.5px;line-height:1.45}
        #error{padding:20px;font-size:13px}
    }
    /* 竖屏旋转成横屏后：面板收进左上角，别挡住画面主体 */
    body.rot90 #ui{left:6px;right:auto;top:6px;bottom:auto;width:300px;padding:7px 9px}
    body.rot90 #ui .hint{display:none}
    body.rot90 #ui h3{font-size:13px;margin-bottom:5px}
    body.rot90 #status{left:auto;right:6px;top:6px;bottom:auto;width:auto;padding:6px 9px}
    @media (max-height:460px){
        #ui .hint{display:none}
        #status{display:none}
    }

    /* ===== 优化意见弹窗 ===== */
    #fbBtn{position:absolute;right:15px;bottom:15px;z-index:120;
        background:rgba(10,20,10,.82);color:#d8f0d8;border:1px solid rgba(140,220,140,.45);
        padding:9px 15px;border-radius:22px;font-size:13px;font-family:inherit;cursor:pointer;
        backdrop-filter:blur(6px);transition:background .15s,transform .15s}
    #fbBtn:hover{background:rgba(30,60,30,.9);transform:translateY(-1px)}
    #fbBtn:active{transform:translateY(0)}
    #fbMask{display:none;position:absolute;inset:0;z-index:130;
        background:rgba(0,0,0,.45);backdrop-filter:blur(2px);
        align-items:center;justify-content:center;padding:16px}
    #fbMask.on{display:flex}
    #fbBox{width:460px;max-width:100%;max-height:100%;overflow:auto;
        background:rgba(14,26,14,.97);color:#e6f4e6;border:1px solid rgba(140,220,140,.35);
        border-radius:14px;padding:16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.55);font-size:13px}
    #fbBox h4{margin:0 0 4px;font-size:15px;color:#bfe8bf}
    #fbBox p.sub{margin:0 0 10px;font-size:11.5px;color:#93b093;line-height:1.5}
    #fbText{width:100%;min-height:110px;max-height:34vh;resize:vertical;box-sizing:border-box;
        background:rgba(0,0,0,.35);color:#eaf7ea;border:1px solid rgba(140,220,140,.3);
        border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;line-height:1.55}
    #fbText:focus{outline:none;border-color:rgba(160,240,160,.75);box-shadow:0 0 0 2px rgba(120,220,120,.18)}
    #fbCount{font-size:11px;color:#8fa98f;text-align:right;margin-top:3px}
    #fbRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
    #fbRow button{font-family:inherit;font-size:12.5px;padding:8px 14px;border-radius:8px;cursor:pointer;
        border:1px solid rgba(140,220,140,.35);background:rgba(30,50,30,.9);color:#d8f0d8;transition:background .15s}
    #fbRow button:hover{background:rgba(45,80,45,.95)}
    #fbRow button.primary{background:#3f8f4a;border-color:#5fb86b;color:#fff;font-weight:600}
    #fbRow button.primary:hover{background:#4aa457}
    #fbRow button.ghost{background:transparent}
    #fbMsg{margin-top:9px;font-size:12px;color:#9ee49e;min-height:17px;line-height:1.5}
    #fbMsg.err{color:#ffb4b4}
    @media (max-width:600px),(pointer:coarse){
        #fbBtn{right:8px;bottom:auto;top:8px;padding:7px 11px;font-size:12px}
        body.rot90 #fbBtn{left:6px;right:auto;bottom:6px;top:auto}
        #fbBox{padding:13px 14px}
        #fbText{min-height:88px;font-size:12.5px}
    }
</style>
</head>
<body>
<div id="app">
<div id="scene"></div>
<div id="ui">
    <h3>🌲 森林小屋 · 优化版</h3>
    <div class="hint"><span class="mouse">鼠标拖拽旋转 ｜ 滚轮缩放 ｜ T 键切换天气 ｜ P 键切换自动巡游</span><span class="touch">单指拖动旋转 ｜ 双指捏合缩放 ｜ 点按钮切换天气</span></div>
    <div class="wbtns" id="wbtns"></div>
    <div class="row"><label>太阳高度角</label><input type="range" id="sunElev" min="3" max="80" value="45"><b id="sunElevV">45°</b></div>
    <div class="row"><label>雾气浓度</label><input type="range" id="fogAmt" min="0" max="100" value="0"><b id="fogAmtV">0%</b></div>
    <div class="row"><label>自动巡游</label><input type="checkbox" id="orbitChk"><b id="orbitV">关</b></div>
</div>
<div id="status">初始化中…</div>
<button id="fbBtn" type="button">💬 优化意见</button>
<div id="fbMask">
    <div id="fbBox" role="dialog" aria-modal="true" aria-labelledby="fbTitle">
        <h4 id="fbTitle">💬 写下你的优化意见</h4>
        <p class="sub">想改什么、哪里不好看、希望加什么，随便写。<br>点「提交意见」会先复制一份、同时静默发给我；没有回传通道时也能粘到聊天里发我。</p>
        <textarea id="fbText" maxlength="600" placeholder="例如：小屋屋顶想换成茅草；向日葵太少了；夜里太黑看不清路……"></textarea>
        <div id="fbCount">0 / 600</div>
        <div id="fbRow">
            <button type="button" class="primary" id="fbCopy">提交意见</button>
            <button type="button" class="ghost" id="fbClear">清空</button>
            <button type="button" class="ghost" id="fbClose">关闭</button>
        </div>
        <div id="fbMsg"></div>
    </div>
</div>
</div><!-- /#app -->
<div id="error"></div>

<script src="js/three.min.js"></script>
<script>
'use strict';

/* ==================== 启动保护 ==================== */
function showFatal(msg){
    var el=document.getElementById('error');
    el.style.display='block';
    el.textContent='⚠ 场景无法启动\n\n'+msg+
        '\n\n请确认 js/three.min.js 与本文件在同一目录，且文件完整（约 600KB）。';
    document.getElementById('status').textContent='启动失败';
}
if(typeof THREE==='undefined'){
    showFatal('THREE 库未加载（js/three.min.js 缺失或损坏）。');
    throw new Error('THREE undefined');
}

/* ==================== 全局状态 ==================== */
let scene, camera, renderer, controls, clock;
// 触屏设备：只有它才该整体旋转成横屏。桌面窄窗口不能被转，否则界面会歪掉
const IS_TOUCH = (typeof navigator!=='undefined' && /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent))
    || (typeof window!=='undefined' && typeof window.matchMedia==='function'
        && window.matchMedia('(pointer:coarse)').matches);
// 移动端降档：触屏 或 小屏，都降低像素比、阴影分辨率与实例数量
const IS_MOBILE = IS_TOUCH
    || (typeof window!=='undefined' && Math.min(window.innerWidth||1920, window.innerHeight||1080) < 820);
let weatherIndex = 0;
// 竖屏时整体旋转 90°；画面尺寸随旋转交换
let ROT = false;
const LAYOUT = {w: (typeof window!=='undefined'?window.innerWidth:1280)||1280,
                h: (typeof window!=='undefined'?window.innerHeight:720)||720};
function measureLayout(){
    const iw=(typeof window!=='undefined'?window.innerWidth:1280)||1280;
    const ih=(typeof window!=='undefined'?window.innerHeight:720)||720;
    ROT = IS_TOUCH && ih > iw+2;
    LAYOUT.w = ROT ? ih : iw;
    LAYOUT.h = ROT ? iw : ih;
    return LAYOUT;
}
function updateOrientation(){
    measureLayout();
    if(typeof document!=='undefined' && document.body && document.body.classList)
        document.body.classList.toggle('rot90', ROT);
    return LAYOUT;
}
let ambient, hemi, sun, sunMesh, moonMesh, starsGroup = null, rainPoints = null;
let pondMesh = null, houseWindows = [], lampLight = null, fireflies = [];
let birds = [], butterflies = [], bees = [], squirrels = [], smokePuffs = [];
let swayGroups = [];           // 风动组：花/草/树枝
const weatherModes  = ['sunny','mist','night','rain','golden'];
const weatherLabels = ['晴天','雾天','夜间','雨天','金色时刻'];
// 当前生效的天气目标值（滑杆在此基础上微调）
const wx = { elev:45, fogMul:0, orbit:false };

/* ==================== 程序化贴图工厂 ==================== */
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function canvasTex(c, rx, ry){
    const t=new THREE.CanvasTexture(c);
    // 关键：输出编码为 sRGB 时必须声明贴图是 sRGB，否则颜色被当作线性值，整场发灰发白
    if(THREE.sRGBEncoding!==undefined) t.encoding=THREE.sRGBEncoding;
    if(rx) t.wrapS=t.wrapT=THREE.RepeatWrapping;
    if(rx) t.repeat.set(rx,ry||rx);
    t.anisotropy = 4;
    return t;
}
// sRGB 十六进制 → 线性空间颜色（r128 无颜色管理，材质色需手动转换）
function C(hex){ return new THREE.Color(hex).convertSRGBToLinear(); }
// 草地噪波贴图
function grassTexture(){
    const c=makeCanvas(512,512), g=c.getContext('2d');
    g.fillStyle='#4a6b3a'; g.fillRect(0,0,512,512);
    for(let i=0;i<9000;i++){
        const x=Math.random()*512, y=Math.random()*512;
        const l=Math.random();
        g.fillStyle = l<0.4?'#3f5c31':l<0.7?'#567a42':'#678f4e';
        g.fillRect(x,y,2+(Math.random()*3|0),1);
    }
    // 少量深色斑块
    for(let i=0;i<40;i++){
        g.fillStyle='rgba(40,60,30,0.25)';
        g.beginPath();
        g.arc(Math.random()*512,Math.random()*512,8+Math.random()*22,0,7);
        g.fill();
    }
    return canvasTex(c, 14, 14);
}
// 原木墙贴图
function logWallTexture(){
    const c=makeCanvas(256,256), g=c.getContext('2d');
    g.fillStyle='#9c6b3c'; g.fillRect(0,0,256,256);
    for(let y=0;y<256;y+=32){
        const grd=g.createLinearGradient(0,y,0,y+32);
        grd.addColorStop(0,'#7a4f28'); grd.addColorStop(0.15,'#a87342');
        grd.addColorStop(0.85,'#96653a'); grd.addColorStop(1,'#6b4423');
        g.fillStyle=grd; g.fillRect(0,y,256,32);
        // 木纹
        g.strokeStyle='rgba(80,50,25,0.35)';
        for(let k=0;k<5;k++){
            g.beginPath();
            g.moveTo(0,y+4+k*6);
            g.bezierCurveTo(64,y+2+k*6+Math.random()*4,192,y+7+k*6-Math.random()*4,256,y+4+k*6);
            g.stroke();
        }
        // 钉孔
        g.fillStyle='rgba(40,25,12,0.8)';
        g.beginPath(); g.arc(14,y+16,2.4,0,7); g.fill();
        g.beginPath(); g.arc(242,y+16,2.4,0,7); g.fill();
    }
    return canvasTex(c, 2, 1.5);
}
// 屋顶瓦片贴图
function roofTexture(){
    const c=makeCanvas(256,256), g=c.getContext('2d');
    g.fillStyle='#7e3528'; g.fillRect(0,0,256,256);
    for(let row=0;row<8;row++){
        const y=row*32;
        for(let col=0;col<8;col++){
            const x=col*32-(row%2?16:0);
            const grd=g.createLinearGradient(0,y,0,y+34);
            grd.addColorStop(0,'#9c4634'); grd.addColorStop(1,'#6d2c20');
            g.fillStyle=grd;
            g.beginPath();
            g.moveTo(x+2,y+30); g.lineTo(x+2,y+8);
            g.quadraticCurveTo(x+16,y-2,x+30,y+8);
            g.lineTo(x+30,y+30); g.closePath(); g.fill();
            g.strokeStyle='rgba(30,10,8,0.5)'; g.stroke();
        }
    }
    return canvasTex(c, 3, 2);
}
// 太阳光晕 sprite
function glowTexture(inner, mid){
    const c=makeCanvas(128,128), g=c.getContext('2d');
    const grd=g.createRadialGradient(64,64,2,64,64,64);
    grd.addColorStop(0,inner);
    grd.addColorStop(0.25,mid);
    grd.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=grd; g.fillRect(0,0,128,128);
    const t=new THREE.CanvasTexture(c);
    if(THREE.sRGBEncoding!==undefined) t.encoding=THREE.sRGBEncoding;
    return t;
}
// 烟雾 sprite
function smokeTexture(){
    const c=makeCanvas(64,64), g=c.getContext('2d');
    const grd=g.createRadialGradient(32,32,2,32,32,30);
    grd.addColorStop(0,'rgba(220,220,220,0.85)');
    grd.addColorStop(0.6,'rgba(200,200,200,0.35)');
    grd.addColorStop(1,'rgba(200,200,200,0)');
    g.fillStyle=grd; g.fillRect(0,0,64,64);
    const t=new THREE.CanvasTexture(c);
    if(THREE.sRGBEncoding!==undefined) t.encoding=THREE.sRGBEncoding;
    return t;
}

/* ==================== 简易轨道相机 ==================== */
function makeOrbitControls(cam, dom){
    const st = {
        target:new THREE.Vector3(0,4,0),
        theta:Math.PI*0.22, phi:Math.PI*0.30, radius:38,
        tTheta:null, tPhi:null, tRadius:null,
        dragging:false, lastX:0, lastY:0
    };
    function apply(){
        if(st.tTheta!==null){
            st.theta+=(st.tTheta-st.theta)*0.06; st.phi+=(st.tPhi-st.phi)*0.06;
            st.radius+=(st.tRadius-st.radius)*0.06;
            if(Math.abs(st.tTheta-st.theta)<0.002&&Math.abs(st.tRadius-st.radius)<0.02){
                st.tTheta=st.tPhi=st.tRadius=null;
            }
        }
        if(wx.orbit && !st.dragging) st.theta += 0.0016;
        const sp=Math.sin(st.phi), cp=Math.cos(st.phi);
        cam.position.set(
            st.target.x+st.radius*sp*Math.sin(st.theta),
            st.target.y+st.radius*cp,
            st.target.z+st.radius*sp*Math.cos(st.theta));
        cam.lookAt(st.target);
    }
    dom.style.cursor='grab';
    dom.style.touchAction='none';   // 关键：不让浏览器把手势当成页面滚动/缩放

    // 统一用 Pointer Events，鼠标与触摸共用一套逻辑
    const pointers=new Map();
    let pinchDist=0;
    function fingerDist(){
        const p=[...pointers.values()];
        return Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    }
    dom.addEventListener('pointerdown',e=>{
        if(e.pointerType==='mouse'&&e.button!==0)return;
        if(dom.setPointerCapture){ try{dom.setPointerCapture(e.pointerId);}catch(_){} }
        pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
        st.dragging=true; st.tTheta=st.tPhi=st.tRadius=null;
        dom.style.cursor='grabbing';
        if(pointers.size===2) pinchDist=fingerDist();
    });
    dom.addEventListener('pointermove',e=>{
        const prev=pointers.get(e.pointerId);
        if(!prev)return;
        pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(pointers.size===1){
            let dx=e.clientX-prev.x, dy=e.clientY-prev.y;
            if(ROT){ const t=dx; dx=dy; dy=-t; }   // 画布被旋转 90°，拖动方向要跟着换
            st.theta-=dx*0.005;
            st.phi  +=dy*0.005;
            st.phi=Math.max(0.1,Math.min(Math.PI/2-0.04,st.phi));
        }else if(pointers.size===2){
            const d=fingerDist();
            if(pinchDist>0&&d>0){
                st.radius*=pinchDist/d;
                st.radius=Math.max(9,Math.min(130,st.radius));
            }
            pinchDist=d;
        }
    });
    function endPointer(e){
        if(!pointers.has(e.pointerId))return;
        pointers.delete(e.pointerId);
        if(pointers.size<2) pinchDist=0;
        if(pointers.size===0){ st.dragging=false; dom.style.cursor='grab'; }
    }
    dom.addEventListener('pointerup',endPointer);
    dom.addEventListener('pointercancel',endPointer);
    dom.addEventListener('lostpointercapture',endPointer);
    // iOS Safari 的私有手势事件也要挡掉，否则双指会缩放整页
    dom.addEventListener('gesturestart',e=>e.preventDefault());
    dom.addEventListener('gesturechange',e=>e.preventDefault());
    dom.addEventListener('contextmenu',e=>e.preventDefault());

    dom.addEventListener('wheel',e=>{
        e.preventDefault();
        st.radius*=e.deltaY>0?1.08:0.92;
        st.radius=Math.max(9,Math.min(130,st.radius));
    },{passive:false});
    apply();
    return { update:apply, target:st.target,
        flyTo(theta,phi,radius){ st.tTheta=theta; st.tPhi=phi; st.tRadius=radius; } };
}

/* ==================== 天空穹顶（渐变 shader，随天气插值） ==================== */
let skyMat;
function createSky(){
    skyMat = new THREE.ShaderMaterial({
        uniforms:{
            topColor:{value:new THREE.Color(0x3d7bd9)},
            bottomColor:{value:new THREE.Color(0xbfdff2)},
            offset:{value:20}, exponent:{value:0.7}
        },
        vertexShader:`varying vec3 vWorldPos;
            void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vWorldPos=wp.xyz;
            gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader:`uniform vec3 topColor; uniform vec3 bottomColor;
            uniform float offset; uniform float exponent; varying vec3 vWorldPos;
            void main(){ float h=normalize(vWorldPos+vec3(0.0,offset,0.0)).y;
            vec3 col=mix(bottomColor,topColor,pow(max(h,0.0),exponent));
            // 自定义 ShaderMaterial 不会自动做输出编码，这里手动转 sRGB
            gl_FragColor=vec4(pow(col,vec3(0.4545)),1.0);}`,
        side:THREE.BackSide, depthWrite:false, fog:false
    });
    const sky=new THREE.Mesh(new THREE.SphereGeometry(280,32,16),skyMat);

function hash2(x,y){ let n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function terrainH(x,z){
    const d=Math.hypot(x,z);
    const flat=Math.min(1,Math.max(0,(d-24)/16));   // 半径24内完全平
    const n=hash2(Math.floor(x/6),Math.floor(z/6))*2-1;
    const n2=hash2(Math.floor(x/17)+3,Math.floor(z/17)+7)*2-1;
    return (n*0.5+n2*0.9)*flat;
}
function createTerrain(){

/* ==================== 树木（合并几何体，每棵树仅 2 个 mesh） ==================== */
function mergeGeos(list){
    // list 元素可以是裸 BufferGeometry，也可以是 {geo, matrix}
    // 统一取 geo，并保留每个几何体自己的顶点属性集合（position/normal/uv）
    const geos=list.map(it=>(it && it.isBufferGeometry)?it:(it&&it.geo));
    geos.forEach((g,i)=>{ if(!g) throw new Error('mergeGeos: 第 '+i+' 项不是几何体'); });
    const nonIndexed=geos.map(g=>g.index?g.toNonIndexed():g);
    const merged=THREE.BufferGeometryUtils ?
        THREE.BufferGeometryUtils.mergeBufferGeometries(nonIndexed,false):
        concatGeos(nonIndexed);
    return merged;
}
function concatGeos(geos){
    let vc=0; geos.forEach(g=>vc+=g.attributes.position.count);
    const pos=new Float32Array(vc*3), nor=new Float32Array(vc*3), uv=new Float32Array(vc*2);
    let off=0;
    for(const g of geos){
        const p=g.attributes.position, n=g.attributes.normal, u=g.attributes.uv;
        pos.set(p.array,off*3);
        if(n)nor.set(n.array,off*3);
        if(u)uv.set(u.array,off*2);
        else for(let i=0;i<p.count;i++)uv.set([0,0],(off+i)*2);
        off+=p.count;
    }
    const out=new THREE.BufferGeometry();
    out.setAttribute('position',new THREE.BufferAttribute(pos,3));
    out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
    out.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    return out;
}
const TREE_BARK = new THREE.MeshStandardMaterial({color:0x6e4a26,roughness:1});
const TREE_BIRCH= new THREE.MeshStandardMaterial({color:0xe6e1cf,roughness:1});
const NEEDLE_A  = new THREE.MeshStandardMaterial({color:0x2e7d32,roughness:1});
const NEEDLE_B  = new THREE.MeshStandardMaterial({color:0x388e3c,roughness:1});
const LEAF_A    = new THREE.MeshStandardMaterial({color:0x7ec850,roughness:1});
const LEAF_B    = new THREE.MeshStandardMaterial({color:0x66bb44,roughness:1});

function buildPineGeo(seed){
    const rnd=mulberry32(seed);
    const trunk=new THREE.CylinderGeometry(0.32,0.62,4.2,7);
    trunk.translate(0,2.1,0);
    const parts=[{geo:trunk,matrix:new THREE.Matrix4()}];
    const barkParts=[{geo:trunk}];
    const leafParts=[];
    for(let i=0;i<4;i++){
        const cone=new THREE.ConeGeometry(2.5-i*0.5,2.8-rnd()*0.5,8);
        cone.translate((rnd()-0.5)*0.2,4.2+i*1.35,(rnd()-0.5)*0.2);
        leafParts.push(cone);
    }
    return {bark:barkParts, leaves:leafParts};
}
function buildBirchGeo(seed){
    const rnd=mulberry32(seed);
    const trunk=new THREE.CylinderGeometry(0.26,0.42,5.6,7);
    trunk.translate(0,2.8,0);
    const barkParts=[{geo:trunk}];
    const leafParts=[];
    for(let i=0;i<3;i++){
        const ball=new THREE.IcosahedronGeometry(1.5+rnd()*0.6,1);
        ball.translate((rnd()-0.5)*2.0,6+rnd()*1.6,(rnd()-0.5)*2.0);
        leafParts.push(ball);
    }
    return {bark:barkParts, leaves:leafParts};
}
function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function plantTree(x,z,isPine,seed){
    const spec=isPine?buildPineGeo(seed):buildBirchGeo(seed);
    const barkGeo=mergeGeos(spec.bark);
    const leafGeo=mergeGeos(spec.leaves);
    const barkMat=isPine?TREE_BARK:TREE_BIRCH;
    const leafMat=(seed%2)?(isPine?NEEDLE_A:LEAF_A):(isPine?NEEDLE_B:LEAF_B);
    const tree=new THREE.Group();
    const bm=new THREE.Mesh(barkGeo,barkMat); bm.castShadow=bm.receiveShadow=true;
    const lm=new THREE.Mesh(leafGeo,leafMat); lm.castShadow=true;
    tree.add(bm,lm);
    const s=0.75+((seed*7)%100)/100*0.6;
    tree.scale.setScalar(s);
    tree.position.set(x,terrainH(x,z),z);
    tree.rotation.y=seed%6.28;
    scene.add(tree);
    swayGroups.push({obj:lm,baseRot:0,amp:0.02+((seed*13)%7)/240,phase:(seed%10),pivot:'z'});
    return tree;
}
function createTrees(){
    const rnd=mulberry32(20261020);
    const placed=[];
    function ok(x,z,minGap){
        if(Math.hypot(x+7,z+4)<9)return false;          // 避开小屋
        if(Math.hypot(x-8,z-6)<13)return false;         // 避开空地
        if(Math.hypot(x-20,z+12)<7)return false;        // 避开水塘
        for(const p of placed) if(Math.hypot(p[0]-x,p[1]-z)<minGap) return false;
        return true;
    }
    for(let i=0;i<34;i++){
        let x,z,t=0;
        do{ const a=rnd()*Math.PI*2,d=22+rnd()*44; x=Math.cos(a)*d; z=Math.sin(a)*d; t++; }while(!ok(x,z,5)&&t<30);
        if(!ok(x,z,5))continue;
        placed.push([x,z]);
        const tree=plantTree(x,z,i%3!==0,i*131+7);
        if(i%3!==0&&rnd()<0.5)attachSquirrel(tree);
        else if(rnd()<0.6)attachBird(tree);
    }
}

function createFence(){
    const mat=new THREE.MeshStandardMaterial({color:0x8a6a44,roughness:1});
    // 围在场地后侧，避免横穿花田
    const pts=[];
    for(let i=0;i<=14;i++){
        const t=i/14;
        pts.push([-19+t*38, -15.5-Math.sin(t*Math.PI)*2.2]);
    }
    pts.forEach(([x,z])=>{
        const post=new THREE.Mesh(new THREE.BoxGeometry(0.22,1.35,0.22),mat);
        post.position.set(x,terrainH(x,z)+0.68,z);
        post.castShadow=post.receiveShadow=true; scene.add(post);
    });
    for(let i=0;i<pts.length-1;i++){
        const [ax,az]=pts[i],[bx,bz]=pts[i+1];
        const len=Math.hypot(bx-ax,bz-az);
        for(const h of [0.40,0.78,1.14]){
            const rail=new THREE.Mesh(new THREE.BoxGeometry(len,0.11,0.09),mat);
            const mx=(ax+bx)/2, mz=(az+bz)/2;
            rail.position.set(mx,terrainH(mx,mz)+h,mz);
            rail.rotation.y=-Math.atan2(bz-az,bx-ax);
            rail.castShadow=true;
            scene.add(rail);
        }
    }
}

let flowerHeadIM, flowerStemIM, grassIM, weedIM;
const dummy = new THREE.Object3D();
const tmpV = new THREE.Vector3(), tmpE = new THREE.Euler();
function createSunflowers(){
    const N=IS_MOBILE?26:42;
    // 花杆实例
    const stemGeo=new THREE.CylinderGeometry(0.06,0.09,1,5).translate(0,0.5,0);
    flowerStemIM=new THREE.InstancedMesh(stemGeo,
        new THREE.MeshStandardMaterial({color:0x4f7a2e,roughness:1}),N);
    flowerStemIM.castShadow=true;
    // 花头实例（盘+花瓣预合并）
    // 花盘与花瓣统一朝 +Z 组装：花瓣在 XY 平面内放射，实例化时再整体转向
    const disk=new THREE.CylinderGeometry(0.24,0.24,0.09,20);
    disk.rotateX(Math.PI/2); disk.translate(0,0,0.04);
    const petals=[];
    for(let j=0;j<14;j++){
        const p=new THREE.ConeGeometry(0.125,0.40,4);  // 4 边锥压扁 = 尖头花瓣
        p.scale(1,1,0.30);
        p.translate(0,0.46,0.03);                      // 基部咬住花盘边缘
        p.rotateZ(j/14*Math.PI*2);
        petals.push(p);
    }
    const all=[disk,...petals];
    const headGeo=concatGeos(all.map(g=>g.index?g.toNonIndexed():g));
    // 材质底色留白，实际颜色由每个实例的 instanceColor 决定（否则会重复相乘变暗）
    flowerHeadIM=new THREE.InstancedMesh(headGeo,
        new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.85}),N);
    flowerHeadIM.castShadow=true;
    const coreGeo=new THREE.CylinderGeometry(0.17,0.17,0.05,18);
    coreGeo.rotateX(Math.PI/2); coreGeo.translate(0,0,0.08);
    const coreIM=new THREE.InstancedMesh(coreGeo,
        new THREE.MeshStandardMaterial({color:0x5a3a15,roughness:1}),N);
    scene.add(flowerStemIM,flowerHeadIM,coreIM);
    flowerHeadIM.userData.cores=coreIM;

    const rnd=mulberry32(777);
    const centers=[], fdata=[];
    for(let i=0;i<N;i++){
        let x,z,t=0;
        do{ const a=rnd()*Math.PI*2,d=2+rnd()*12.5; x=8+Math.cos(a)*d; z=6+Math.sin(a)*d; t++; }
        while(t<8&&centers.some(c=>Math.hypot(c[0]-x,c[1]-z)<1.1));
        centers.push([x,z]);
        // 花头朝"花田外"方向，并向斜上方仰起（像真向日葵朝着光）
        const face=Math.atan2(x-8,z-6)+(rnd()-0.5)*0.5;
        const pitch=-0.42+(rnd()-0.5)*0.30;
        const h=1.5+rnd()*1.0;
        const y=terrainH(x,z);
        // 记录真实参数，供每帧摆动还原（不能另造随机数，否则花头会脱杆）
        fdata.push({x:x,z:z,y:y,h:h,rot:face,pitch:pitch,phase:rnd()*6.28});
        dummy.position.set(x,y,z);
        dummy.rotation.set(0,face,0);
        dummy.scale.set(1,h,1);
        dummy.updateMatrix();
        flowerStemIM.setMatrixAt(i,dummy.matrix);
        dummy.rotation.set(pitch,face,0);
        dummy.position.set(x,y+h,z);
        dummy.scale.set(1,1,1);
        dummy.updateMatrix();
        flowerHeadIM.setMatrixAt(i,dummy.matrix);
        coreIM.setMatrixAt(i,dummy.matrix);
        // 花瓣颜色微差异：大部分金黄，夹杂橙 / 奶油白 / 红褐，远看更像真花田
        const r2=rnd();
        const tint=r2<0.68?0xe8a81a:(r2<0.84?0xf07a18:(r2<0.94?0xf5e6a8:0xa8381c));
        flowerHeadIM.setColorAt(i, C(tint));
    }
    [flowerStemIM,flowerHeadIM,coreIM].forEach(im=>im.instanceMatrix.needsUpdate=true);
    if(flowerHeadIM.instanceColor) flowerHeadIM.instanceColor.needsUpdate=true;
    swayGroups.push({kind:'flower',count:N,data:fdata,
        inst:flowerHeadIM,extra:coreIM,stem:flowerStemIM});
}
function createGrass(){

        const y=terrainH(x,z);
        const rx=(rnd()-0.5)*0.3, ry=rnd()*6.28, rz=(rnd()-0.5)*0.3, sc=0.6+rnd()*0.9;
        gdata.push({x:x,y:y,z:z,rx:rx,ry:ry,rz:rz,s:sc,phase:rnd()*6.28});

        dummy.rotation.set(rx,ry,rz);
        dummy.scale.setScalar(sc);
        dummy.updateMatrix();
        grassIM.setMatrixAt(i,dummy.matrix);

    for(let i=0;i<90;i++){
        const a=rnd()*Math.PI*2,d=4+rnd()*14;
        const x=8+Math.cos(a)*d, z=6+Math.sin(a)*d;
        dummy.position.set(x,terrainH(x,z),z);
        dummy.rotation.set(0,rnd()*6.28,0);
        dummy.scale.setScalar(0.7+rnd()*0.8);
        dummy.updateMatrix();
        weedIM.setMatrixAt(i,dummy.matrix);
    }
    grassIM.instanceMatrix.needsUpdate=true;
    weedIM.instanceMatrix.needsUpdate=true;
    swayGroups.push({kind:'grass',inst:grassIM,count:N,data:gdata});
}

function attachSquirrel(tree){
    const sq=new THREE.Group();
    const mat=new THREE.MeshStandardMaterial({color:0xc47a3d,roughness:0.9});
    const body=new THREE.Mesh(new THREE.SphereGeometry(0.28,8,8),mat);
    body.scale.set(1,0.8,1.4); body.castShadow=true;
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.17,8,8),mat);
    head.position.set(0,0.28,0.34);
    const ear=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.12,6),mat);
    ear.position.set(0.08,0.42,0.3);
    const ear2=ear.clone(); ear2.position.x=-0.08;
    const tail=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,8),mat);
    tail.scale.set(0.7,1.6,0.7); tail.position.set(0,0.4,-0.42); tail.rotation.x=0.6;
    sq.add(body,head,ear,ear2,tail);
    sq.position.set(0.55/tree.scale.x,3.2,0.3/tree.scale.x);
    tree.add(sq);
    squirrels.push({group:sq,baseY:sq.position.y,baseX:sq.position.x,
        phase:Math.random()*6.28,tree});
}
function attachBird(tree){
    const bird=new THREE.Group();
    const colors=[0x4a90d9,0xd94a4a,0xd9a520,0x7a4ad9,0x3dbb7c];
    const c=colors[Math.floor(Math.random()*colors.length)];
    const mat=new THREE.MeshStandardMaterial({color:c,roughness:0.8});
    const body=new THREE.Mesh(new THREE.SphereGeometry(0.16,8,8),mat);
    body.scale.set(1,0.9,1.3); body.castShadow=true;
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),mat);
    head.position.set(0,0.13,0.18);
    const beak=new THREE.Mesh(new THREE.ConeGeometry(0.045,0.14,6),
        new THREE.MeshStandardMaterial({color:0xffa500}));
    beak.position.set(0,0.13,0.33); beak.rotation.x=Math.PI/2;
    const wingGeo=new THREE.BoxGeometry(0.02,0.12,0.22);
    const wingL=new THREE.Mesh(wingGeo,mat); wingL.position.set(-0.14,0.02,0);
    const wingR=new THREE.Mesh(wingGeo,mat); wingR.position.set(0.14,0.02,0);
    const tailF=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.1,0.14),mat);
    tailF.position.set(0,0.02,-0.24); tailF.rotation.x=-0.4;
    bird.add(body,head,beak,wingL,wingR,tailF);
    bird.position.set((Math.random()-0.5)*1.4/tree.scale.x,6.4/tree.scale.x,(Math.random()-0.5)*1.4/tree.scale.x);
    tree.add(bird);
    birds.push({group:bird,wingL,wingR,phase:Math.random()*6.28,
        hopPhase:Math.random()*6.28,baseY:bird.position.y});
}

/* ==================== 昆虫 ==================== */
function createInsects(){
    const bColors=[0xff69b4,0xffa500,0x66ccff,0xc9a0ff,0xffef7f,0xff5555];
    for(let i=0;i<16;i++){
        const b=new THREE.Group();
        const body=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.3,6),
            new THREE.MeshStandardMaterial({color:0x222222}));
        body.rotation.x=Math.PI/2;
        const wm=new THREE.MeshStandardMaterial({color:bColors[i%bColors.length],
            side:THREE.DoubleSide,transparent:true,opacity:0.92,roughness:0.6});
        const wg=new THREE.CircleGeometry(0.24,8);
        const wingL=new THREE.Mesh(wg,wm); wingL.scale.set(1,1.4,1); wingL.position.set(-0.14,0,0);
        const wingR=new THREE.Mesh(wg,wm); wingR.scale.set(1,1.4,1); wingR.position.set(0.14,0,0);
        b.add(body,wingL,wingR);
        const a=Math.random()*6.28,d=3+Math.random()*13;
        b.position.set(8+Math.cos(a)*d,1.4+Math.random()*1.6,6+Math.sin(a)*d);
        scene.add(b);
        butterflies.push({group:b,wingL,wingR,home:b.position.clone(),
            phase:Math.random()*6.28,speed:0.5+Math.random()*0.8,radius:1.5+Math.random()*3.5});
    }
    for(let i=0;i<12;i++){
        const bee=new THREE.Group();
        const body=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),
            new THREE.MeshStandardMaterial({color:0xf2c40f,roughness:0.5}));
        body.scale.set(1,0.9,1.4); body.castShadow=true;
        const stripe=new THREE.Mesh(new THREE.CylinderGeometry(0.101,0.101,0.06,8),
            new THREE.MeshStandardMaterial({color:0x2b2b2b}));
        stripe.rotation.x=Math.PI/2;
        const wm=new THREE.MeshStandardMaterial({color:0xeaf6ff,transparent:true,
            opacity:0.5,side:THREE.DoubleSide});
        const wg=new THREE.PlaneGeometry(0.24,0.12);
        const wingL=new THREE.Mesh(wg,wm); wingL.position.set(-0.14,0.08,0);
        const wingR=new THREE.Mesh(wg,wm); wingR.position.set(0.14,0.08,0);
        bee.add(body,stripe,wingL,wingR);
        const a=Math.random()*6.28,d=3+Math.random()*12;
        bee.position.set(8+Math.cos(a)*d,1.1+Math.random(),6+Math.sin(a)*d);
        scene.add(bee);
        bees.push({group:bee,wingL,wingR,home:bee.position.clone(),phase:Math.random()*6.28});
    }
    // 萤火虫（仅夜间显示）
    const fg=new THREE.BufferGeometry();
    const fp=new Float32Array(60*3);
    for(let i=0;i<60;i++){
        const a=Math.random()*6.28,d=4+Math.random()*16;
        fp[i*3]=8+Math.cos(a)*d; fp[i*3+1]=0.6+Math.random()*2.2; fp[i*3+2]=6+Math.sin(a)*d;
    }
    fg.setAttribute('position',new THREE.BufferAttribute(fp,3));
    const fm=new THREE.PointsMaterial({color:0xccff66,size:0.22,transparent:true,
        opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
    fireflies.push({points:new THREE.Points(fg,fm),seeds:fp.slice()});
    scene.add(fireflies[0].points);
}

/* ==================== 天气系统 ==================== */
const SKY={
    sunny :{top:0x3d7bd9,bot:0xbfdff2,fog:0xa8cfe8,dens:0.0016,amb:0.20,hemi:0.30,sunC:0xfff2cc,sunI:2.60,elev:45,azim:0.9,expo:0.12,ev:1.00},
    mist  :{top:0x9fb0bc,bot:0xd7dee3,fog:0xd7dee3,dens:0.018, amb:0.42,hemi:0.40,sunC:0xffffff,sunI:0.55,elev:60,azim:0.4,expo:0.0, ev:1.28},
    night :{top:0x050a1e,bot:0x16213e,fog:0x0a0f24,dens:0.014, amb:0.06,hemi:0.07,sunC:0x8899dd,sunI:0.30,elev:35,azim:-2.2,expo:0.0, ev:0.80},
    rain  :{top:0x39434f,bot:0x66717e,fog:0x55606e,dens:0.010, amb:0.35,hemi:0.40,sunC:0xaabbcc,sunI:1.00,elev:55,azim:1.6,expo:0.0, ev:1.18},
    golden:{top:0x2e5fa3,bot:0xf5b878,fog:0xe8a868,dens:0.004, amb:0.16,hemi:0.24,sunC:0xff9a3c,sunI:2.20,elev:8, azim:2.4,expo:0.25,ev:1.05}
};
let curSky={top:new THREE.Color(),bot:new THREE.Color(),fog:new THREE.Color(),
    dens:0,amb:0,hemi:0,sunC:new THREE.Color(),sunI:0,elev:45,azim:0.9,expo:0.12,ev:1.0};
// 天气色转线性空间（r128 无颜色管理，shader 输出前只做 sRGB 编码）
const SKY_LIN={};
for(const _k in SKY){
    SKY_LIN[_k]={top:C(SKY[_k].top),bot:C(SKY[_k].bot),fog:C(SKY[_k].fog),sunC:C(SKY[_k].sunC)};
}
let tgtSky=SKY.sunny, tgtSkyL=SKY_LIN.sunny;

// 一次性把场景内所有材质颜色从 sRGB 转到线性（否则整体发灰泛白）
let __linDone=false;
function linearizeMaterials(root){
    if(__linDone) return;
    const seen=new Set();
    root.traverse(o=>{
        if(!o.material) return;
        (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
            if(!m||seen.has(m)) return; seen.add(m);
            if(m.color&&m.color.isColor) m.color.convertSRGBToLinear();
            if(m.emissive&&m.emissive.isColor) m.emissive.convertSRGBToLinear();
        });
    });
    __linDone=true;
}

function setWeather(idx,instant){
    weatherIndex=idx;
    tgtSky=SKY[weatherModes[idx]];
    tgtSkyL=SKY_LIN[weatherModes[idx]];
    wx.elev=tgtSky.elev; wx.fogMul=0;
    document.getElementById('sunElev').value=tgtSky.elev;
    document.getElementById('sunElevV').textContent=Math.round(tgtSky.elev)+'°';
    document.getElementById('fogAmt').value=0;
    document.getElementById('fogAmtV').textContent='0%';
    if(instant)Object.assign(curSky,{dens:tgtSky.dens,amb:tgtSky.amb,hemi:tgtSky.hemi,
        elev:tgtSky.elev,azim:tgtSky.azim,expo:tgtSky.expo,ev:tgtSky.ev,sunI:tgtSky.sunI});
    // 星空 / 雨 / 萤火虫开关
    const wantStars=weatherModes[idx]==='night';
    if(wantStars&&!starsGroup)addStars();
    if(!wantStars&&starsGroup){scene.remove(starsGroup);starsGroup=null;}
    const wantRain=weatherModes[idx]==='rain';
    if(wantRain&&!rainPoints)addRain();
    if(!wantRain&&rainPoints){scene.remove(rainPoints);rainPoints=null;}
    updateWeatherUI();
}
function lerpWeather(dt){
    const k=Math.min(1,dt*1.6);
    curSky.top.lerp(tgtSkyL.top,k);
    curSky.bot.lerp(tgtSkyL.bot,k);
    curSky.fog.lerp(tgtSkyL.fog,k);
    curSky.sunC.lerp(tgtSkyL.sunC,k);
    curSky.dens+=(tgtSky.dens-curSky.dens)*k;
    curSky.amb +=(tgtSky.amb -curSky.amb )*k;
    curSky.hemi+=(tgtSky.hemi-curSky.hemi)*k;
    curSky.sunI +=(tgtSky.sunI -curSky.sunI )*k;
    curSky.elev +=(tgtSky.elev -curSky.elev )*k;
    curSky.azim+=(tgtSky.azim-curSky.azim)*k;
    curSky.expo +=(tgtSky.expo -curSky.expo )*k;
    curSky.ev   +=(tgtSky.ev   -curSky.ev   )*k;

    // 应用滑杆微调
    const elev=wx.elev, dens=curSky.dens*(1+wx.fogMul*4);
    skyMat.uniforms.topColor.value.copy(curSky.top);
    skyMat.uniforms.bottomColor.value.copy(curSky.bot);
    skyMat.uniforms.exponent.value=curSky.expo;
    scene.fog.color.copy(curSky.fog);
    scene.fog.density=dens;
    scene.background=curSky.fog;
    ambient.intensity=curSky.amb;
    hemi.intensity=curSky.hemi;
    sun.color.copy(curSky.sunC);
    sun.intensity=curSky.sunI;
    const r=40, ea=Math.sin(elev*Math.PI/180);
    sun.position.set(Math.cos(curSky.azim)*r*ea, Math.sin(elev*Math.PI/180)*r+2, Math.sin(curSky.azim)*r*ea);
    sunMesh.position.copy(sun.position).multiplyScalar(3.2);
    moonMesh.position.set(Math.cos(curSky.azim+Math.PI)*110,60,Math.sin(curSky.azim+Math.PI)*110);
    const isNight=weatherModes[weatherIndex]==='night';
    sunMesh.visible=!isNight&&elev>4;
    moonMesh.visible=isNight;
    // 云的明暗与浓淡（夜间云压到极暗，否则会把夜空糊成灰褐色）
    const dark=isNight?0.10:(weatherModes[weatherIndex]==='rain'?0.45:weatherModes[weatherIndex]==='mist'?0.75:1);
    cloudGroup.children.forEach((g,i)=>{
        g.children.forEach(s=>{
            s.material.color.setScalar(dark);
            s.material.opacity=(isNight?0.12:0.8)*(weatherModes[weatherIndex]==='mist'?1.2:1);
        });
        g.position.x+=g.userData.speed*0.016;
        if(g.position.x>170)g.position.x=-170;
    });
    // 窗户灯光
    const lit=isNight?0xffb347:weatherModes[weatherIndex]==='golden'?0x552200:0x000000;
    houseWindows.forEach(w=>{ w.material.emissive.setHex(lit).convertSRGBToLinear(); w.material.emissiveIntensity=isNight?0.95:0.4; });
    const lamp=window.__house?.userData.lamp;
    if(lamp){ lamp.material.emissive.setHex(isNight?0xffd27a:0x000000).convertSRGBToLinear(); }
    if(lampLight)lampLight.intensity=isNight?1.4:0;
    // 萤火虫
    const ff=fireflies[0];
    if(ff)ff.points.material.opacity=isNight?(0.55+Math.sin(clock.elapsedTime*2)*0.2):0;
    // 曝光由各天气预设的 ev 平滑过渡
    renderer.toneMappingExposure=curSky.ev;
}
function addStars(){
    starsGroup=new THREE.Group();
    const g=new THREE.BufferGeometry(), p=[];
    for(let i=0;i<500;i++){
        const a=Math.random()*6.28,ph=Math.random()*Math.PI*0.46,r=140+Math.random()*80;
        p.push(Math.cos(a)*Math.sin(ph)*r,Math.cos(ph)*r+8,Math.sin(a)*Math.sin(ph)*r);
    }
    g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
    starsGroup.add(new THREE.Points(g,new THREE.PointsMaterial({
        color:0xffffff,size:1.25,sizeAttenuation:true,transparent:true,opacity:0.95,
        depthWrite:false,fog:false})));
    scene.add(starsGroup);
}
function addRain(){
    const N=IS_MOBILE?700:1200,pos=new Float32Array(N*3),vel=new Float32Array(N);
    for(let i=0;i<N;i++){
        pos[i*3]=(Math.random()-0.5)*140; pos[i*3+1]=Math.random()*55; pos[i*3+2]=(Math.random()-0.5)*140;
        vel[i]=0.7+Math.random()*0.6;
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    rainPoints=new THREE.Points(g,new THREE.PointsMaterial({
        color:0xaaccff,size:0.16,transparent:true,opacity:0.55}));
    rainPoints.userData.vel=vel;
    scene.add(rainPoints);
}

/* ==================== 动画 ==================== */
function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(0.05,clock.getDelta());
    const t=clock.elapsedTime;

    lerpWeather(dt);

    // 风吹摆动（强度随天气）
    const windK=weatherModes[weatherIndex]==='rain'?1.6:weatherModes[weatherIndex]==='mist'?0.3:1;
    swayGroups.forEach(sg=>{
        if(sg.obj){
            sg.obj.rotation[sg.pivot]=Math.sin(t*1.1+sg.phase)*sg.amp*windK;
        }else if(sg.kind==='flower'){
            const heads=sg.inst, cores=sg.extra, stems=sg.stem;
            for(let i=0;i<sg.count;i++){
                const d=sg.data[i];
                const sx=Math.sin(t*1.25+d.phase)*0.055*windK;
                const sz=Math.cos(t*0.95+d.phase*1.3)*0.045*windK;
                // 花杆：以基部为轴弯折（杆几何体底部在原点，Y 缩放即株高）
                dummy.position.set(d.x,d.y,d.z);
                dummy.rotation.set(sx,d.rot,sz);
                dummy.scale.set(1,d.h,1);
                dummy.updateMatrix();
                if(stems)stems.setMatrixAt(i,dummy.matrix);
                // 花头：精确跟到弯折后的杆顶，再叠自身倾角
                tmpE.set(sx,d.rot,sz);
                tmpV.set(0,d.h,0).applyEuler(tmpE);
                dummy.position.set(d.x+tmpV.x,d.y+tmpV.y,d.z+tmpV.z);
                dummy.rotation.set(sx+d.pitch,d.rot,sz);
                dummy.scale.set(1,1,1);
                dummy.updateMatrix();
                heads.setMatrixAt(i,dummy.matrix);
                cores.setMatrixAt(i,dummy.matrix);
            }
            heads.instanceMatrix.needsUpdate=true;
            cores.instanceMatrix.needsUpdate=true;
            if(stems)stems.instanceMatrix.needsUpdate=true;
        }else if(sg.kind==='grass'){
            const im=sg.inst;
            for(let i=0;i<sg.count;i++){
                const d=sg.data[i];
                const w=Math.sin(t*2.1+d.phase)*0.10*windK;
                dummy.position.set(d.x,d.y,d.z);
                dummy.rotation.set(d.rx+w*0.7,d.ry,d.rz+w);
                dummy.scale.setScalar(d.s);
                dummy.updateMatrix();
                im.setMatrixAt(i,dummy.matrix);
            }
            im.instanceMatrix.needsUpdate=true;
        }
    });

    // 鸟
    birds.forEach(b=>{
        b.phase+=dt*6;
        b.wingL.rotation.z=Math.sin(b.phase)*0.9;
        b.wingR.rotation.z=-Math.sin(b.phase)*0.9;
        b.group.rotation.y=Math.sin(b.phase*0.15)*0.5;
        b.hopPhase+=dt*2;
        b.group.position.y=b.baseY+Math.max(0,Math.sin(b.hopPhase))*0.06;
    });
    // 松鼠
    squirrels.forEach(s=>{
        s.phase+=dt*1.1;
        s.group.position.y=s.baseY+Math.sin(s.phase)*0.4;
        s.group.position.x=s.baseX+Math.sin(s.phase*0.5)*0.3;
        s.group.rotation.y=s.phase*0.4;
    });
    // 蝴蝶
    butterflies.forEach(b=>{
        b.phase+=dt*b.speed;
        b.group.position.x=b.home.x+Math.cos(b.phase)*b.radius;
        b.group.position.z=b.home.z+Math.sin(b.phase*0.8)*b.radius;
        b.group.position.y=b.home.y+Math.sin(b.phase*2)*0.5;
        b.group.rotation.y=-b.phase;
        const flap=Math.sin(t*20+b.phase*5)*0.95;
        b.wingL.rotation.y=flap; b.wingR.rotation.y=-flap;
    });
    // 蜜蜂
    bees.forEach(b=>{
        b.phase+=dt*1.4;
        b.group.position.x=b.home.x+Math.sin(b.phase)*1.3;
        b.group.position.z=b.home.z+Math.cos(b.phase*1.3)*1.3;
        b.group.position.y=b.home.y+Math.sin(b.phase*3)*0.25;
        b.group.rotation.y=-b.phase*1.3;
        const flap=Math.sin(t*42+b.phase)*0.7;
        b.wingL.rotation.z=0.3+flap; b.wingR.rotation.z=-0.3-flap;
    });
    // 萤火虫飘动
    const ff=fireflies[0];
    if(ff&&ff.points.material.opacity>0.01){
        const arr=ff.points.geometry.attributes.position.array;
        for(let i=0;i<arr.length;i+=3){
            arr[i]  =ff.seeds[i]  +Math.sin(t*0.6+i)*0.8;
            arr[i+1]=ff.seeds[i+1]+Math.sin(t*1.1+i*2)*0.35;
            arr[i+2]=ff.seeds[i+2]+Math.cos(t*0.5+i)*0.8;
        }
        ff.points.geometry.attributes.position.needsUpdate=true;
    }
    // 炊烟
    const windy=weatherModes[weatherIndex]==='rain'?2.2:1;
    smokePuffs.forEach(p=>{
        p.t+=dt*0.22;
        if(p.t>1)p.t-=1;
        const k=p.t;
        p.sprite.position.set(
            p.anchor.x+k*k*1.6*windy,
            p.anchor.y+k*5,
            p.anchor.z+k*0.6);
        p.sprite.scale.setScalar(0.7+k*3.2);
        p.sprite.material.opacity=Math.sin(k*Math.PI)*0.4;
    });
    // 水面微波
    if(pondMesh){
        pondMesh.material.color.setHex(curSky.sunI>0.8?0x3f7fa8:0x2a4f6e);
        pondMesh.position.y=0.06+Math.sin(t*1.2)*0.015;
    }
    // 雨
    if(rainPoints){
        const arr=rainPoints.geometry.attributes.position.array;
        const vel=rainPoints.userData.vel;
        for(let i=0;i<vel.length;i++){
            arr[i*3+1]-=vel[i]*60*dt;
            arr[i*3]+=0.06;                     // 斜落
            if(arr[i*3+1]<0){arr[i*3+1]=55;arr[i*3]=(Math.random()-0.5)*140;arr[i*3+2]=(Math.random()-0.5)*140;}
        }
        rainPoints.geometry.attributes.position.needsUpdate=true;
    }
    if(starsGroup)starsGroup.rotation.y+=dt*0.008;

    controls.update();
    renderer.render(scene,camera);
    fpsTick(dt);
}

/* ==================== FPS + 状态 ==================== */
let frames=0,fpsAcc=0,fps=0;
function fpsTick(dt){
    frames++; fpsAcc+=dt;
    if(fpsAcc>=0.5){fps=Math.round(frames/fpsAcc);frames=0;fpsAcc=0;updateStatus();}
}
// 用 DOM API 拼状态面板：全程 textContent，不做 HTML 字符串拼接
function statusLine(label,value,color){
    const d=document.createElement('div');
    d.appendChild(document.createTextNode(label));
    const b=document.createElement('b');
    if(color) b.style.color=color;
    b.textContent=String(value);
    d.appendChild(b);
    return d;
}
function updateStatus(){
    const s=document.getElementById('status');
    const frag=document.createDocumentFragment();
    frag.appendChild(statusLine('FPS:',fps,
        fps>45?'#7fdc7f':fps>25?'#ffd97a':'#ff8f8f'));
    frag.appendChild(statusLine('draw calls:',renderer.info.render.calls));
    frag.appendChild(statusLine('松鼠:',squirrels.length+' 鸟:'+birds.length));
    frag.appendChild(statusLine('蝴蝶:',butterflies.length+' 蜜蜂:'+bees.length));
    frag.appendChild(statusLine('天气:',
        weatherLabels[weatherIndex]||'-','#ffd97a'));
    s.textContent='';
    s.appendChild(frag);
}

/* ==================== UI ==================== */
function buildWeatherButtons(){
    const box=document.getElementById('wbtns');
    weatherLabels.forEach((lab,i)=>{
        const b=document.createElement('button');
        b.textContent=lab; b.dataset.i=i;
        b.onclick=()=>setWeather(i);
        box.appendChild(b);
    });
}
function updateWeatherUI(){
    [...document.querySelectorAll('#wbtns button')].forEach((b,i)=>
        b.classList.toggle('active',i===weatherIndex));
}
function cycleWeather(){ setWeather((weatherIndex+1)%weatherModes.length); }
function onKeyDown(e){
    if(e.key==='t'||e.key==='T')cycleWeather();
    if(e.key==='p'||e.key==='P'){
        wx.orbit=!wx.orbit;
        document.getElementById('orbitChk').checked=wx.orbit;
        document.getElementById('orbitV').textContent=wx.orbit?'开':'关';
    }
}
function setupSliders(){
    const se=document.getElementById('sunElev'), sv=document.getElementById('sunElevV');
    se.addEventListener('input',()=>{wx.elev=+se.value;sv.textContent=se.value+'°';});
    const fa=document.getElementById('fogAmt'), fv=document.getElementById('fogAmtV');
    fa.addEventListener('input',()=>{wx.fogMul=fa.value/100;fv.textContent=fa.value+'%';});
    document.getElementById('orbitChk').addEventListener('change',e=>{
        wx.orbit=e.target.checked;
        document.getElementById('orbitV').textContent=wx.orbit?'开':'关';
    });
}

/* ==================== 优化意见弹窗 ==================== */
// 提交策略：先本地复制（永不丢），再向**同源** /api/feedback 静默回传一条。
// 回传失败不影响任何人体验 —— 用户看到的只是「已复制」，粘给我就行。
const FB_MAX=600;
// 回传地址：FormSubmit 无需注册，POST 即发邮件到下面这个邮箱（首次会发一封确认信，点一次即可）。
// 留空则退回本站服务器的 /api/feedback；两种都不可用时只复制、不发送。
// 想隐藏邮箱：激活后 FormSubmit 会给你一个编码地址（https://formsubmit.co/xxxxx），替换掉下面这行即可。
const FB_RELAY='https://formsubmit.co/ajax/2820575692@qq.com';
function fbEndpoint(){
    if(FB_RELAY) return FB_RELAY;
    return '/api/feedback';
}
function fbEl(id){ return document.getElementById(id); }
function pad2(n){ return n<10?'0'+n:''+n; }
function feedbackStamp(){
    const d=new Date();
    return '【优化意见】'+d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+
        pad2(d.getHours())+':'+pad2(d.getMinutes())+
        ' · 天气:'+(weatherLabels[weatherIndex]||'-')+
        ' · 画面:'+LAYOUT.w+'x'+LAYOUT.h+(ROT?'(横屏)':'');
}
function feedbackText(){
    const body=(fbEl('fbText').value||'').trim();
    return feedbackStamp()+'\n'+body;
}
function setFbMsg(msg,isErr){
    const m=fbEl('fbMsg');
    m.textContent=msg||'';
    m.className=isErr?'err':'';
}
// 剪贴板：优先异步 API（https/localhost 才有），否则退回 execCommand
function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
        return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve,reject)=>{
        const ta=document.createElement('textarea');
        ta.value=text;
        ta.style.position='fixed';
        ta.style.top='0';
        ta.style.opacity='0';
        ta.setAttribute('readonly','readonly');
        document.body.appendChild(ta);
        ta.select();
        let ok=false;
        try{ ok=document.execCommand('copy'); }catch(err){ ok=false; }
        document.body.removeChild(ta);
        if(ok) resolve(); else reject(new Error('浏览器不允许复制'));
    });
}
// 静默回传：只发往 fbEndpoint()，3 秒超时，任何失败都不抛错、不弹窗
function sendFeedback(body){
    if(typeof fetch!=='function') return Promise.resolve(false);
    const meta=(body&&body.meta)||{};
    const text=(body&&body.text)||'';
    // FormSubmit 收扁平字段，才会排成一张表发到邮箱
    const payload=FB_RELAY?{
        _subject:'【森林小屋】优化意见',
        _captcha:'false',
        _template:'table',
        内容:text,
        天气:meta.weather||'-',
        画面:meta.screen||'-',
        手机:meta.mobile?'是':'否',
        浏览器:meta.ua||''
    }:{text:text,meta:meta};
    let timer=null;
    try{
        const ctrl=(typeof AbortController==='function')?new AbortController():null;
        if(ctrl) timer=setTimeout(()=>ctrl.abort(),3000);
        const url=fbEndpoint();
        return fetch(url,{
            method:'POST',
            headers:{'Content-Type':'application/json','Accept':'application/json'},
            body:JSON.stringify(payload),
            credentials:'omit',
            keepalive:true,
            signal:ctrl?ctrl.signal:undefined
        }).then(r=>{
            if(timer) clearTimeout(timer);
            if(!r.ok) return false;
            // FormSubmit 成功时回 {"success":"true"}；解析不了就当成功
            return r.json().then(j=>String(j&&j.success||'').toLowerCase()==='true')
                .catch(()=>true);
        }).catch(()=>{
            if(timer) clearTimeout(timer);
            return false;
        });
    }catch(err){
        if(timer) clearTimeout(timer);
        return Promise.resolve(false);
    }
}
let fbOpen=false;
function openFeedback(){
    if(fbOpen) return;
    fbOpen=true;
    fbEl('fbMask').classList.add('on');
    setFbMsg('');
    const t=fbEl('fbText');
    try{ t.focus({preventScroll:true}); }catch(err){ t.focus(); }
}
function closeFeedback(){
    if(!fbOpen) return;
    fbOpen=false;
    fbEl('fbMask').classList.remove('on');
    setFbMsg('');
}
function setupFeedback(){
    const ta=fbEl('fbText'), cnt=fbEl('fbCount');
    fbEl('fbBtn').addEventListener('click',openFeedback);
    fbEl('fbClose').addEventListener('click',closeFeedback);
    fbEl('fbMask').addEventListener('click',e=>{
        if(e.target===fbEl('fbMask')) closeFeedback();
    });
    ta.addEventListener('input',()=>{
        cnt.textContent=ta.value.length+' / '+FB_MAX;
        if(fbEl('fbMsg').className==='err') setFbMsg('');
    });
    fbEl('fbClear').addEventListener('click',()=>{
        ta.value='';
        cnt.textContent='0 / '+FB_MAX;
        setFbMsg('');
        ta.focus();
    });
    fbEl('fbCopy').addEventListener('click',()=>{
        const text=feedbackText();
        if((ta.value||'').trim().length===0){
            setFbMsg('还没写内容呢，先写两句再提交。',true);
            ta.focus();
            return;
        }
        // ① 先复制 —— 这一步不依赖网络，永远可用
        copyToClipboard(text).then(()=>{
            setFbMsg('已复制。正在发送…');
        }).catch(()=>{
            ta.value=text;
            cnt.textContent=ta.value.length+' / '+FB_MAX;
            try{ ta.focus(); ta.setSelectionRange(0,text.length); }catch(err){}
            setFbMsg('这个浏览器不让自动复制，文本已全选，长按「复制」。正在发送…',true);
        }).then(()=>{
            // ② 再静默回传（可能不可用：静态托管 / 离线打开）
            return sendFeedback({
                text:text,
                meta:{
                    weather:(weatherLabels[weatherIndex]||''),
                    screen:LAYOUT.w+'x'+LAYOUT.h+(ROT?' 横屏':''),
                    mobile:IS_MOBILE,
                    ua:(typeof navigator!=='undefined'&&navigator.userAgent)?navigator.userAgent:''
                }
            });
        }).then(ok=>{
            if(ok){
                setFbMsg('✅ 已收到，谢谢！已复制到剪贴板，想补充可以直接粘给我。');
            }else{
                setFbMsg('✅ 已复制到剪贴板 —— 这条链接没有回传通道，粘到聊天里发我即可。');
            }
            fbEl('fbText').value='';
            cnt.textContent='0 / '+FB_MAX;
        });
    });
    // Esc 关闭：挂在 document 上，但不阻断原有 T/P 快捷键
    document.addEventListener('keydown',e=>{
        if(e.key==='Escape' && fbOpen){
            closeFeedback();
            e.stopPropagation();
        }
    },true);
}

/* ==================== 初始化 ==================== */
function init(){
    try{
        renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
        updateOrientation();
        renderer.setSize(LAYOUT.w,LAYOUT.h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE?1.6:2));
        renderer.shadowMap.enabled=true;
        renderer.shadowMap.type=THREE.PCFSoftShadowMap;
        renderer.outputEncoding=THREE.sRGBEncoding;
        renderer.toneMapping=THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure=1.0;
        document.getElementById('scene').appendChild(renderer.domElement);
    }catch(e){
        showFatal('WebGL 初始化失败：'+e.message);return;
    }

    clock=new THREE.Clock();
    camera=new THREE.PerspectiveCamera(55,LAYOUT.w/LAYOUT.h,0.1,700);
    scene=new THREE.Scene();
    scene.fog=new THREE.FogExp2(0xa8cfe8,0.0016);
    scene.background=new THREE.Color(0xa8cfe8);

    createSky();
    createClouds();

    ambient=new THREE.AmbientLight(0xffffff,0.45); scene.add(ambient);
    hemi=new THREE.HemisphereLight(0xbfdff2,0x3a5a2f,0.55); scene.add(hemi);
    sun=new THREE.DirectionalLight(0xfff2cc,1.35);
    sun.castShadow=true;
    sun.shadow.mapSize.set(IS_MOBILE?1024:2048, IS_MOBILE?1024:2048);
    sun.shadow.camera.near=1; sun.shadow.camera.far=140;
    sun.shadow.camera.left=-42; sun.shadow.camera.right=42;
    sun.shadow.camera.top=42; sun.shadow.camera.bottom=-42;
    // 改了视锥必须手动更新投影矩阵，否则阴影相机仍是最初的 ±5，整个场景几乎没有影子
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.bias=-0.0004;
    sun.shadow.normalBias=0.03;
    scene.add(sun); scene.add(sun.target);

    sunMesh=new THREE.Mesh(new THREE.SphereGeometry(3,16,16),
        new THREE.MeshBasicMaterial({color:0xfff3b0,fog:false}));
    const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({
        map:glowTexture('rgba(255,240,180,0.95)','rgba(255,200,90,0.35)'),
        transparent:true,depthWrite:false,fog:false}));
    sunGlow.scale.setScalar(38);
    sunMesh.add(sunGlow);
    scene.add(sunMesh);

    moonMesh=new THREE.Mesh(new THREE.SphereGeometry(2.4,16,16),
        new THREE.MeshBasicMaterial({color:0xe8ecf5,fog:false}));
    const moonGlow=new THREE.Sprite(new THREE.SpriteMaterial({
        map:glowTexture('rgba(220,230,255,0.8)','rgba(160,180,255,0.25)'),
        transparent:true,depthWrite:false,fog:false}));
    moonGlow.scale.setScalar(20);
    moonMesh.add(moonGlow);
    scene.add(moonMesh);

    // 屋内暖光点光源
    lampLight=new THREE.PointLight(0xffc873,0,14,2);
    lampLight.position.set(-5.5,3.5,-1.5);
    scene.add(lampLight);

    createTerrain();
    createHouse();
    createFence();
    createTrees();
    createSunflowers();
    createGrass();
    createInsects();

    controls=makeOrbitControls(camera,renderer.domElement);
    buildWeatherButtons();
    setupSliders();
    setupFeedback();
    window.addEventListener('resize',onResize);
    window.addEventListener('keydown',onKeyDown);

    setWeather(0,true);
    // 支持 index.html#night 之类的天气直达链接
    const _h=(location.hash||'').replace('#','').toLowerCase();
    const _hi=weatherModes.indexOf(_h);
    if(_hi>0) setWeather(_hi,true);
    // 所有材质就位后统一转线性空间（sRGB 输出下才不会被冲淡成灰白）
    linearizeMaterials(scene);
    animate();
    document.getElementById('status').textContent='✅ 运行中';
}
function onResize(){
    updateOrientation();
    camera.aspect=LAYOUT.w/LAYOUT.h;
    camera.updateProjectionMatrix();
    renderer.setSize(LAYOUT.w,LAYOUT.h);
    if(renderer.setPixelRatio)
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE?1.6:2));
}
window.addEventListener('orientationchange',()=>setTimeout(onResize,220));
window.addEventListener('load',()=>{
    try{ init(); }
    catch(e){ showFatal('初始化异常：'+e.message+'\n'+(e.stack||'')); throw e; }
});
</script>
</body>
